site_name: Demucs Karaoke App
docs_dir: docs
site_dir: site
site_url: ""
use_directory_urls: true

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom

extra_css:
  - assets/stylesheets/karaoke.css
extra_javascript:
  - assets/javascripts/docs-root-links.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # Keep every app language reachable while translations are added later.
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Back to App: Torna all'app
            Home: Pagina iniziale
            Getting Started: Per iniziare
            Overview: Panoramica
            Demucs Service: Servizio Demucs
            Clients: Dispositivi client
            Backup, Restore, Upgrade: Backup, ripristino e aggiornamento
            Features: Funzionalità
            Queue Page: Pagina della coda
            Media Page: Libreria multimediale
            Stage Display: Schermo del palco
            Media Editing: Modifica dei file multimediali
            Configuration: Configurazione
            Environments: Variabili d'ambiente
            Settings Page: Pagina delle impostazioni
            Karaoke Processing: Elaborazione karaoke
            WhisperX Lyrics: Testi con WhisperX
            Application Paths: Percorsi dell'applicazione
            Downloads: Download
            Stage: Palco
            Tools: Strumenti
            Custom Lyrics Provider: Provider di testi personalizzato
            Tasks: Guide pratiche
            For Users: Per gli utenti
            Karaoke Tasks: Operazioni karaoke
            Create AI Karaoke: Creare karaoke con l'IA
            Stage & Branding: Palco e personalizzazione
            Server Administration: Amministrazione del server
            Media Administration: Gestione dei file multimediali
            Troubleshooting: Risoluzione dei problemi
        - locale: zh
          name: 简体中文
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
nav:
  - Back to App: '../../../../../demucs-karaoke-app'
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Docker: getting-started/docker.md
      - Linux: getting-started/linux.md
      - Windows: getting-started/windows.md
      - Demucs Service: getting-started/demucs-service.md
      - Clients: getting-started/clients.md
      - Backup, Restore, Upgrade: getting-started/backup-and-restore.md
  - Features:
      - Queue Page: features/queue-page.md
      - Media Page: features/media-page.md
      - Stage Display: features/stage-display.md
      - Media Editing: features/media-editing.md
  - Configuration: 
      - Environments: configuration/environments.md
      - Settings Page: configuration/settings.md
      - Karaoke Processing: configuration/karaoke-processing.md
      - WhisperX Lyrics: configuration/whisperx-lyrics.md
      - Application Paths: configuration/application-paths.md
      - Downloads: configuration/downloads.md
      - Stage: configuration/stage.md
      - Tools: configuration/tools.md
      - Custom Lyrics Provider: configuration/custom-lyrics-provider.md
  - Tasks:
      - For Users: tasks/for-users.md
      - Karaoke Tasks: tasks/karaoke-tasks.md
      - Create AI Karaoke: tasks/create-ai-karaoke.md
      - Stage & Branding: tasks/stage-and-branding.md
      - Server Administration: tasks/server-administration.md
      - Media Administration: tasks/media-administration.md
  - Troubleshooting:
      - Troubleshooting: troubleshooting/index.md
